name: Python compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv sync --locked --no-editable --python ${{ matrix.python }}
      - run: uv pip check
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv build
      - name: Check installed CLI outside the checkout
        run: uv run --no-sync python -c "import os, subprocess, sysconfig; command = os.path.join(sysconfig.get_path('scripts'), 'pbo.exe' if os.name == 'nt' else 'pbo'); os.chdir(os.environ['RUNNER_TEMP']); subprocess.run([command, '--help'], check=True)"
